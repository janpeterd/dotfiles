[preview]
cache_dir = "$HOME/.cache/yazi"
max_width = 2000
max_height = 2000

[[plugin.prepend_previewers]]
url = "*.odt"
run  = 'piper -- odt2txt "$1"'

[[plugin.prepend_previewers]]
url = "*.docx"
run  = 'piper -- docx2txt "$1" -'

[[plugin.prepend_fetchers]]
group  = "git"
url = "*"
run = "git"

[[plugin.prepend_fetchers]]
group  = "git"
url = "*/"
run = "git"

[opener]
edit = [
  { run = 'nvim %s', block = true, for = "unix" },
  { run = 'code %s', orphan = true, for = "windows" },
]
play = [
  { run = 'mpv %s', orphan = true, for = "unix" },
  { run = '"C:\Program Files\mpv.exe" %s', orphan = true, for = "windows" },
]
view = [{ run = 'imv %s', orphan = true, for = "unix" }]
open = [
  { run = 'xdg-open %s1', desc = "Open", for = "linux" },
  { run = 'open %s', desc = "Open", for = "macos" },
  { run = 'start "" %s1', orphan = true, desc = "Open", for = "windows" },
]
extract = [
  { run = 'ya pub extract --list %s', desc = "Extract here" },
]


[open]
rules = [
  { mime = "text/*", use = ["edit", "open"] },
  { mime = "video/*", use = ["play", "open"] },
  { mime = "image/*", use = ["view", "open"] },
  { url = "*.json", use = ["edit", "open"] },

  # Multiple openers for a single rule
  { url = "*.html", use = ["open", "edit"] },
  { url = "*.lua", use = ["edit"] },

  { mime = "application/zip", use = ["extract", "reveal"] },
  { mime = "application/gzip", use = ["extract", "reveal"] },
  { mime = "application/x-tar", use = ["extract", "reveal"] },
  { mime = "application/x-bzip", use = ["extract", "reveal"] },
  { mime = "application/x-bzip2", use = ["extract", "reveal"] },
  { mime = "application/x-7z-compressed", use = ["extract", "reveal"] },
  { mime = "application/x-rar", use = ["extract", "reveal"] },
  { mime = "*", use = ["open", "edit"] },
]
